<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console — Admin Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="nav-floating" id="nav">
    <a href="index.html" class="nav-brand">
      <div class="nav-mark"><span>STJR</span></div>
      <span>Console</span>
    </a>
    <a href="index.html" class="btn-magnetic btn-glass nav-cta-desktop">
      <span>Home</span>
      <span class="icon-pill" aria-hidden="true">←</span>
    </a>
    <button class="hamburger" id="hamburger" aria-label="Open menu">
      <span></span><span></span>
    </button>
  </nav>

  <div class="nav-overlay" id="navOverlay">
    <a href="index.html"><span class="num">01</span> Home</a>
    <a href="register.html"><span class="num">02</span> <em>Register</em></a>
    <div class="overlay-foot"><span>STJR · MMXXVI</span></div>
  </div>

  <main class="auth-wrap">
    <article class="auth-card" data-reveal>
      <header class="auth-header">
        <div class="mark">C</div>
        <h1>Admin <em>console</em>.</h1>
        <p>For coordinators only. Sign in to view the live registration record.</p>
      </header>

      <div id="loginAlert" class="alert" role="alert"></div>

      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label for="adminEmail">Email <span class="req">*</span></label>
          <div class="input-bezel" id="bezel-adminEmail">
            <div class="input-core">
              <input type="email" id="adminEmail" name="email" placeholder="admin@pvkn.edu" autocomplete="email" required />
            </div>
          </div>
          <div class="field-error" id="err-adminEmail"></div>
        </div>

        <div class="form-group">
          <label for="adminPassword">Password <span class="req">*</span></label>
          <div class="input-bezel" id="bezel-adminPassword">
            <div class="input-core password-wrap">
              <input type="password" id="adminPassword" name="password" placeholder="At least 6 characters" autocomplete="current-password" required minlength="6" />
              <button type="button" class="toggle-pw" id="togglePw">Show</button>
            </div>
          </div>
          <div class="field-error" id="err-adminPassword"></div>
        </div>

        <button type="submit" id="loginBtn" class="btn-submit">Sign in</button>
      </form>

      <p class="auth-foot">
        Need access? <a href="mailto:stjr@pvkn.edu">Email the coordinator</a>
      </p>
    </article>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <span>© MMXXVI P V K N Government Degree College</span>
      <span>STJR · Console</span>
    </div>
  </footer>

  <script>
    const nav = document.getElementById("nav");
    if (nav) {
      window.addEventListener("scroll", () => {
        nav.classList.toggle("is-scrolled", window.scrollY > 20);
      }, { passive: true });
    }
    const ham = document.getElementById("hamburger");
    const overlay = document.getElementById("navOverlay");
    if (ham && overlay) {
      ham.addEventListener("click", () => {
        ham.classList.toggle("active");
        overlay.classList.toggle("open");
        document.body.style.overflow = overlay.classList.contains("open") ? "hidden" : "";
      });
      overlay.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
        ham.classList.remove("active");
        overlay.classList.remove("open");
        document.body.style.overflow = "";
      }));
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); } });
    }, { threshold: 0.1 });
    document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));
  </script>

  <script type="module" src="js/admin-login.js"></script>

</body>
</html>
